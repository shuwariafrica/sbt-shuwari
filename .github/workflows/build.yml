name: "CI Build"

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ v* ]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SBT_OPTS: >- # Use all available resources
    -Xmx10G
    -Xms6G
    -Xss4M
    -XX:ReservedCodeCacheSize=512M

jobs:
  test:
    name: Execute Tests (Java ${{ matrix.java }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ 17 ]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java }}

      - name: Set up sbt
        uses: sbt/setup-sbt@v1.5.12

      - name: Set up Coursier cache
        uses: coursier/cache-action@v8

      - name: Execute Unit Tests
        run: sbt test

      - name: Package Project Products
        run: sbt package

  publish:
    name: Publish Release
    timeout-minutes: 90
    needs: [ test ]
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: "temurin"
          java-version: 17

      - name: Set up sbt
        uses: sbt/setup-sbt@v1.5.12

      - name: Set up Coursier cache
        uses: coursier/cache-action@v8

      - name: Import Signing Key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.OSS_PUBLISH_USER_SIGNING_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          trust_level: 5

      - name: Publish Projects
        run: sbt "publishSigned; sonaUpload; sonaRelease"
        env:
          SONATYPE_USERNAME: ${{ secrets.OSS_PUBLISH_USER }}
          SONATYPE_PASSWORD: ${{ secrets.OSS_PUBLISH_USER_PASSPHRASE }}
          SIGNING_KEY_ID: ${{ secrets.OSS_PUBLISH_USER_SIGNING_KEY_ID }}

  publish-documentation:
    name: Publish Documentation
    timeout-minutes: 30
    needs: [ publish ]
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: "temurin"
          java-version: 17

      - name: Set up sbt
        uses: sbt/setup-sbt@v1.5.12

      - name: Set up Coursier cache
        uses: coursier/cache-action@v8

      - name: Generate Documentation
        run: sbt sbt-shuwari-documentation/mdoc

      - name: Mint Release Bot Token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Update README on main
        uses: shuwariafrica/.github/actions/api-commit@59c535a9e1eb39fce9bc3e7b8dbcc3a10147b5a1
        with:
          token: ${{ steps.release-bot.outputs.token }}
          paths: README.md
          message: Update documentation for ${{ github.ref_name }}
          branch: main

  synchronise-repositories:
    name: Synchronise Repositories
    timeout-minutes: 30
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Synchronise Azure DevOps
        uses: yesolutions/mirror-action@v0.7.0
        with:
          REMOTE: "git@ssh.dev.azure.com:v3/shuwari/sbt-shuwari/sbt-shuwari"
          GIT_SSH_PRIVATE_KEY: ${{ secrets.DEVOPS_SSH_PRIVATE_KEY }}
          GIT_SSH_NO_VERIFY_HOST: "true"
          PUSH_ALL_REFS: false
